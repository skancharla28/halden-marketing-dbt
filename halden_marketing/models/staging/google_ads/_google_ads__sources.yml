version: 2
sources:
  - name: google_ads
    database: mkt_raw
    schema: google_ads
    description: 'Raw google_ads data. Source system: Google Ads API via Airbyte source-google-ads.'
    tables:
      - name: ad_group
        description: >-
          Daily ad group performance for Search, YouTube and Demand Gen campaigns, with ad group settings.
          Grain: One row per ad group per day. Joins: ad_group_id -> ad_group_ad, keyword_view; campaign_id
          -> campaign. Gotchas: Performance Max has no ad groups, so ad_group spend < campaign spend.
          GAQL field names with '.' replaced by '_' (e.g. metrics.cost_micros -> metrics_cost_micros);
          some destinations keep the dotted names.
        columns:
          - name: campaign_id
            description: Google Ads campaign id (campaign.id). Equals utm_id on Google landing URLs.
            data_type: BIGINT
          - name: ad_group_id
            description: Ad group id. Join key.
            data_type: BIGINT
            data_tests:
              - not_null
          - name: segments_date
            description: Reporting date (account timezone). Daily grain date.
            data_type: DATE
            data_tests:
              - not_null
          - name: metrics_impressions
            description: Impressions. Additive.
            data_type: BIGINT
          - name: metrics_clicks
            description: Clicks. Additive; Google clicks are close to sessions.
            data_type: BIGINT
          - name: metrics_conversions
            description: >-
              Platform conversions (purchases), FRACTIONAL due to data-driven attribution. Platform-claimed;
              brand search & PMax over-claim.
            data_type: DOUBLE
          - name: metrics_conversions_value
            description: Conversion value (revenue) claimed by Google Ads. Platform ROAS numerator.
            data_type: DOUBLE
          - name: metrics_view_through_conversions
            description: Conversions after an impression without a click (video/PMax).
            data_type: BIGINT
          - name: metrics_video_views
            description: Video views (YouTube/Demand Gen).
            data_type: BIGINT
          - name: metrics_cost_micros
            description: Cost in MICROS (1,000,000 micros = 1 USD). Divide by 1e6 for spend.
            data_type: BIGINT
          - name: metrics_all_conversions
            description: All conversions incl. cross-device/other actions.
            data_type: DOUBLE
          - name: metrics_interactions
            description: Clicks + video views.
            data_type: BIGINT
          - name: metrics_ctr
            description: clicks / impressions. Recompute after aggregating.
            data_type: DOUBLE
          - name: metrics_average_cpc
            description: Average CPC in micros. Recompute after aggregating.
            data_type: DOUBLE
          - name: ad_group_name
            description: Ad group name (e.g. W - Merino Tops, Brand - Core).
            data_type: VARCHAR
          - name: ad_group_status
            description: ENABLED / PAUSED.
            data_type: VARCHAR
          - name: ad_group_type
            description: SEARCH_STANDARD, VIDEO_RESPONSIVE, DEMAND_GEN_MULTI_FORMAT.
            data_type: VARCHAR
          - name: ad_group_cpc_bid_micros
            description: Default max CPC bid in micros.
            data_type: DOUBLE
          - name: customer_id
            description: Google Ads account id (customer.id). Join to customer.
            data_type: BIGINT
          - name: _airbyte_raw_id
            description: >-
              Unique id Airbyte assigns to each record it loads. Lineage/debugging only; not a business
              key.
            data_type: VARCHAR
          - name: _airbyte_extracted_at
            description: >-
              UTC time Airbyte extracted this record from the source API. Use to deduplicate (keep latest
              per business key) and for source freshness tests.
            data_type: TIMESTAMP WITH TIME ZONE
          - name: _airbyte_meta
            description: >-
              JSON with sync metadata: {changes: [...type-casting issues...], sync_id}. Check `changes`
              for fields Airbyte could not type-cast.
            data_type: JSON
          - name: _airbyte_generation_id
            description: >-
              Airbyte refresh generation counter (increments on full refresh). Rarely needed; can filter
              to the latest generation after a refresh.
            data_type: BIGINT
      - name: ad_group_ad
        description: >-
          Ads (responsive search ads and video ads) with their settings and final URLs. Grain: One row
          per ad. Joins: ad_group_ad_ad_id -> ad_group_ad_legacy; ad_group_id -> ad_group. Gotchas: GAQL
          field names with '.' replaced by '_' (e.g. metrics.cost_micros -> metrics_cost_micros); some
          destinations keep the dotted names.
        columns:
          - name: ad_group_id
            description: Ad group id. Join key.
            data_type: BIGINT
          - name: campaign_id
            description: Google Ads campaign id (campaign.id). Equals utm_id on Google landing URLs.
            data_type: BIGINT
          - name: ad_group_ad_ad_id
            description: Ad id. Equals utm_content on Search/YouTube clicks.
            data_type: BIGINT
            data_tests:
              - not_null
              - unique
          - name: ad_group_ad_ad_type
            description: RESPONSIVE_SEARCH_AD, VIDEO_RESPONSIVE_AD, DEMAND_GEN_VIDEO_RESPONSIVE_AD.
            data_type: VARCHAR
          - name: ad_group_ad_status
            description: ENABLED / PAUSED.
            data_type: VARCHAR
          - name: ad_group_ad_ad_name
            description: Ad name (video ads); null for responsive search ads.
            data_type: VARCHAR
          - name: ad_group_ad_ad_final_urls
            description: JSON array of landing page URLs.
            data_type: JSON
          - name: ad_group_ad_ad_responsive_search_ad_headlines
            description: JSON array of RSA headlines ({text}). Copy analysis.
            data_type: JSON
          - name: ad_group_ad_policy_summary_approval_status
            description: Policy approval status.
            data_type: VARCHAR
          - name: customer_id
            description: Google Ads account id (customer.id). Join to customer.
            data_type: BIGINT
          - name: _airbyte_raw_id
            description: >-
              Unique id Airbyte assigns to each record it loads. Lineage/debugging only; not a business
              key.
            data_type: VARCHAR
          - name: _airbyte_extracted_at
            description: >-
              UTC time Airbyte extracted this record from the source API. Use to deduplicate (keep latest
              per business key) and for source freshness tests.
            data_type: TIMESTAMP WITH TIME ZONE
          - name: _airbyte_meta
            description: >-
              JSON with sync metadata: {changes: [...type-casting issues...], sync_id}. Check `changes`
