version: 2

models:
  - name: stg_tiktok_marketing__campaigns
    description: One row per TikTok campaign.
    columns:
      - name: campaign_id
        data_tests:
          - unique
          - not_null
      - name: budget
        description: Budget in USD; read with budget_mode (BUDGET_MODE_DAY = daily budget).

  - name: stg_tiktok_marketing__campaign_stats_daily
    description: One row per TikTok campaign per day, with metrics cast from the `metrics` JSON.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['campaign_id', 'date_day']
    columns:
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tiktok_marketing__campaigns')
                field: campaign_id
      - name: date_day
        description: Reporting day in the account timezone, from dimensions.stat_time_day.
        data_tests:
          - not_null
      - name: platform_conversions
        description: Completed payments TikTok attributes to the campaign.
      - name: platform_conversion_value
        description: Value of those payments (TikTok's total_complete_payment_rate).
