version: 2

models:
  - name: stg_shopify__customers
    description: One row per Shopify customer. Scalar fields only; JSON fields are split into the customer_* models.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: First and last name joined with a space; null when both are missing.
      - name: total_spent
        description: Lifetime spend, including orders before the dataset starts.

  - name: stg_shopify__customer_default_addresses
    description: One row per customer, parsed from the `default_address` JSON.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__customers')
                field: customer_id

  - name: stg_shopify__customer_addresses
    description: One row per customer address, unnested from the `addresses` JSON array.
    columns:
      - name: address_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__customers')
                field: customer_id

  - name: stg_shopify__customer_email_consents
    description: One row per customer, parsed from the `email_marketing_consent` JSON.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__customers')
                field: customer_id
      - name: consent_state
        data_tests:
          - accepted_values:
              arguments:
                values: ['subscribed', 'not_subscribed', 'unsubscribed', 'pending']

  - name: stg_shopify__orders
    description: >-
      One row per Shopify order with typed money fields, exclusion flags and last-click attribution
      parsed from landing_site (UTMs URL-decoded; utm_source/utm_medium lowercased). For ROAS, exclude
      is_test, is_cancelled and usually is_wholesale; subtotal_price is net sales before refunds.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__customers')
                field: customer_id
      - name: financial_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'partially_refunded', 'refunded', 'voided', 'pending', 'authorized']
      - name: subtotal_price
        description: Line items minus discounts, before shipping, tax and refunds.
        data_tests:
          - not_null
      - name: discount_code
        description: First discount code on the order (source holds at most one).
      - name: utm_id
        description: Ad platform campaign id for paid channels (Google Ads, Meta, TikTok, LinkedIn); Klaviyo message id for email.
      - name: device_type
        description: mobile / tablet / desktop, derived from the checkout user agent.

  - name: stg_shopify__order_lines
    description: >-
      One row per order line item. gross_amount = unit_price * quantity; discount_amount sums the line's
      discount allocations and reconciles to orders.total_discounts.
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__products')
                field: product_id
      - name: variant_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__product_variants')
                field: variant_id
      - name: quantity
        data_tests:
          - not_null

  - name: stg_shopify__products
    description: >-
      One row per product. gender and season are parsed from tags, which always follow
      '<type>, <gender>, <season>'. Variant-level detail is in stg_shopify__product_variants.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: handle
        description: URL handle (/products/<handle>). Use to join GA4 page paths to products.
        data_tests:
          - unique
          - not_null
      - name: product_type
        description: Product category (Tops, Bottoms, Outerwear, Dresses, Activewear, Accessories, Gift Card).
        data_tests:
          - not_null
      - name: is_gift_card
        description: True for the gift card product. Exclude from merchandise analysis.
      - name: gender
        description: Second tag (women, men, unisex, kids).
        data_tests:
          - accepted_values:
              arguments:
                values: ['women', 'men', 'unisex', 'kids']
      - name: season
        description: Third tag (core = year-round, fall = seasonal).
        data_tests:
          - accepted_values:
              arguments:
                values: ['core', 'fall']
      - name: image_url
        description: URL of the product's main image.

  - name: stg_shopify__product_variants
    description: >-
      One row per product variant (color / size combination). Joins to stg_shopify__products on
      product_id and to stg_shopify__order_lines on variant_id.
    columns:
      - name: variant_id
        data_tests:
          - unique
          - not_null
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__products')
                field: product_id
      - name: sku
        description: >-
          Stock keeping unit. Not unique: SKUs are built from a truncated product name, so related
          products (e.g. the Cloudknit tees and long sleeve) share SKUs. Join on variant_id instead.
      - name: color
        description: Option 1 (Color). Null for the gift card, whose source value is 'Default'.
      - name: size
        description: Option 2 (Size). For the gift card this holds the denomination ('$50').
      - name: price
        description: Current selling price.
        data_tests:
          - not_null
      - name: is_inventory_tracked
        description: True when Shopify tracks inventory for the variant (false for the gift card).

  - name: stg_shopify__customer_journeys
    description: >-
      One row per order from Shopify's customer journey summary: first and last visit source, landing
      page and UTMs, days to conversion and the customer's order index. has_journey is false when
      Shopify did not track the visits.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__orders')
                field: order_id
      - name: customer_order_index
        description: 1 = the customer's first order (new customer), >1 = repeat.

  - name: stg_shopify__order_refunds
    description: >-
      One row per refund (mostly returns, issued 1-5 weeks after the order). Refunded amounts are summed
      from the refund line items; refunded_amount (payment transactions) = refunded_subtotal + refunded_tax.
    columns:
      - name: refund_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__orders')
                field: order_id
      - name: refunded_at
        description: When the refund was issued. Use this date for refund timing, not the order date.
        data_tests:
          - not_null
      - name: return_reason
        description: Refund note without the 'Return - ' prefix, e.g. 'Too small', 'Defective'.
      - name: refunded_subtotal
        description: Refunded merchandise amount, net of discounts and before tax.

  - name: stg_shopify__order_refund_lines
    description: One row per refunded order line. Use for net revenue and return rate by product.
    columns:
      - name: refund_line_id
        data_tests:
          - unique
          - not_null
      - name: refund_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__order_refunds')
                field: refund_id
      - name: order_line_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify__order_lines')
                field: order_line_id
      - name: quantity
        data_tests:
          - not_null
      - name: subtotal_amount
        description: Refunded amount for the line, net of its discount and before tax.
